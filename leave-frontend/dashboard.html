
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Leave Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Leave Management</a>
  </div>
</nav>
<div class="container mt-4">
  <h3>Welcome, John Doe</h3>
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="card border-success">
        <div class="card-header bg-success text-white">Leave Balance</div>
        <div class="card-body">
          <p>PTO: 10.32 days</p>
          <p>Sick Leave: 5.00 days</p>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card border-info">
        <div class="card-header bg-info text-white">Upcoming Holidays</div>
        <div class="card-body">
          <p>Independence Day - July 1</p>
          <p>Umuganura - August 4</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
